# KubeVirt PoC: render only the shared-supervisor templates from the
# OpenShell chart, pointing at the demo gateway running on the host.
gatewayConfig:
  openshell.drivers.kubernetes:
    supervisor_topology: gateway
    namespace: kvpoc-sandboxes
    grpc_endpoint: https://172.18.0.1:18085
    supervisor_image: kvpoc/openshell-supervisor:dev
    supervisor_image_pull_policy: never

# Server TLS: only the clientTlsSecretName matters here (the supervisor
# mounts its ca.crt to verify the demo gateway's certificate).
server:
  disableTls: false
  sandboxNamespace: kvpoc-sandboxes
  tls:
    clientTlsSecretName: kvpoc-server-tls

supervisor:
  replicas: 1
  podDisruptionBudget:
    enabled: false

networkPolicy:
  enabled: true

# The chart renders a full gateway Deployment by default; disable
# everything we run on the host instead.
gateway:
  enabled: false

agentSandbox:
  preflight:
    enabled: false
