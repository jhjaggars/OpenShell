# Acceptance policy for e2e/kubevirt/run-demo.sh in the root workload mode
# (OPENSHELL_KVPOC_WORKLOAD=root).
#
# Identical network semantics to demo-policy.yaml, minus every section a
# root workload cannot enforce:
#
# - No filesystem_policy, landlock, or process sections. In-guest
#   enforcement is meaningless against a root workload (the fence and
#   supervisor-side policy evaluation are the boundary), and the
#   supervisor rejects a root-mode policy that authors them.
# - No binaries lists. The root workload runs with
#   require_binary_identity=false (per-binary identity is unenforceable
#   in-guest), so network policies are endpoint/L7 scoped and
#   policy.binaries are ignored; they are omitted here rather than
#   promising restrictions that cannot hold.
version: 1

network_policies:
  l4_allowed:
    name: l4-allowed
    endpoints:
      - host: one.one.one.one
        port: 443
        protocol: tcp
  l7_https:
    name: l7-https
    endpoints:
      - host: example.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /
        deny_rules:
          - method: POST
            path: /
