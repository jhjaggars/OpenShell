suite: Gateway RBAC creation
templates:
  - templates/role.yaml
  - templates/rolebinding.yaml
  - templates/peer-role.yaml
release:
  name: openshell
  namespace: my-namespace

tests:
  - it: creates the namespaced sandbox Role by default
    template: templates/role.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: openshell-sandbox

  - it: creates the namespaced sandbox RoleBinding by default
    template: templates/rolebinding.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: openshell-sandbox

  - it: creates the gateway peer Role and RoleBinding by default
    template: templates/peer-role.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: openshell-peer

  - it: keeps the namespaced RBAC when only cluster-scoped RBAC is disabled
    set:
      rbac.clusterScoped.create: false
    asserts:
      - hasDocuments:
          count: 1
    template: templates/role.yaml

  - it: keeps the peer RBAC when only cluster-scoped RBAC is disabled
    template: templates/peer-role.yaml
    set:
      rbac.clusterScoped.create: false
    asserts:
      - hasDocuments:
          count: 2

  - it: omits the namespaced sandbox Role when chart-managed RBAC is disabled
    template: templates/role.yaml
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: omits the namespaced sandbox RoleBinding when chart-managed RBAC is disabled
    template: templates/rolebinding.yaml
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: omits the gateway peer Role and RoleBinding when chart-managed RBAC is disabled
    template: templates/peer-role.yaml
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: creates the namespaced sandbox Role when legacy values omit the rbac block
    template: templates/role.yaml
    set:
      rbac: null
    asserts:
      - hasDocuments:
          count: 1

  - it: creates the peer Role and RoleBinding when legacy values omit the rbac block
    template: templates/peer-role.yaml
    set:
      rbac: null
    asserts:
      - hasDocuments:
          count: 2

  - it: grants the KubeVirt runtime rules when the kubevirt runtime is configured
    template: templates/role.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          runtime: kubevirt
      server:
        sandboxNamespace: sandbox-ns
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.namespace
          value: sandbox-ns
      - contains:
          path: rules
          content:
            apiGroups: ["kubevirt.io"]
            resources: ["virtualmachines"]
            verbs: ["create", "delete", "get", "list", "patch", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["kubevirt.io"]
            resources: ["virtualmachineinstances"]
            verbs: ["get", "list", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods"]
            verbs: ["create", "delete", "get", "list", "patch", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["create", "delete", "get", "list", "patch"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["persistentvolumeclaims"]
            verbs: ["create", "delete", "get", "list"]
      - contains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["networkpolicies"]
            verbs: ["create", "get", "list", "delete"]
      - notContains:
          path: rules
          content:
            apiGroups: ["agents.x-k8s.io"]
            resources: ["sandboxes"]
            verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  - it: keeps the pod-path rules when the kubevirt runtime is not configured
    template: templates/role.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["agents.x-k8s.io"]
            resources: ["sandboxes", "sandboxes/status"]
            verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
      - notContains:
          path: rules
          content:
            apiGroups: ["kubevirt.io"]
            resources: ["virtualmachines"]
            verbs: ["create", "delete", "get", "list", "patch", "watch"]
