suite: Service ingress controller deployment
templates:
  - templates/service-ingress-deployment.yaml
release:
  name: openshell
  namespace: my-namespace

tests:
  - it: renders no documents unless reconciliation is enabled
    asserts:
      - hasDocuments:
          count: 0

  - it: deploys one controller replica running the service-ingress subcommand
    set:
      serviceIngress.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: openshell-service-ingress
      - equal:
          path: metadata.namespace
          value: my-namespace
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.serviceAccountName
          value: openshell-service-ingress
      - contains:
          path: spec.template.spec.containers[0].args
          content: service-ingress
      - contains:
          path: spec.template.spec.containers[0].args
          content: --config
      - contains:
          path: spec.template.spec.containers[0].args
          content: /etc/openshell/gateway.toml
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: openshell-config

  - it: honors the replicas value
    set:
      serviceIngress.enabled: true
      serviceIngress.replicas: 2
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: applies custom resources
    set:
      serviceIngress.enabled: true
      serviceIngress.resources:
        requests:
          cpu: 10m
          memory: 32Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 10m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 32Mi

  - it: selects controller pods by component label
    set:
      serviceIngress.enabled: true
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: service-ingress-controller
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: service-ingress-controller
