suite: ClusterRole RBAC
templates:
  - templates/clusterrole.yaml
release:
  name: openshell
  namespace: my-namespace

tests:
  - it: includes the release namespace in the ClusterRole name
    asserts:
      - equal:
          path: metadata.name
          value: openshell-node-reader-my-namespace

  - it: grants managed namespace NetworkPolicy apply permissions
    set:
      server.drivers.kubernetes.workspaceMode: managed
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["networkpolicies"]
            verbs: ["get", "create", "patch", "update"]

  - it: limits namespaced admission reads to PVCs
    set:
      server.drivers.kubernetes.workspaceMode: managed
      server.drivers.kubernetes.allowDriverConfig: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["persistentvolumeclaims"]
            verbs: ["get"]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get"]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["configmaps"]
            verbs: ["get"]

  - it: omits PVC admission reads when caller driver config is disabled
    set:
      server.drivers.kubernetes.workspaceMode: managed
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["persistentvolumeclaims"]
            verbs: ["get"]

  - it: preserves sandbox-runtime fence permissions when gateway isolation is disabled
    set:
      server.drivers.kubernetes.workspaceMode: managed
      networkPolicy.enabled: false
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["networkpolicies"]
            verbs: ["create", "get"]
      - notContains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["networkpolicies"]
            verbs: ["get", "create", "patch", "update"]

  - it: gives schema-v2 managed SSH ingress precedence over the legacy alias
    set:
      server.drivers.kubernetes.workspaceMode: managed
      networkPolicy.enabled: true
      gatewayConfig:
        openshell.drivers.kubernetes.managed_ssh_ingress:
          enabled: false
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["networkpolicies"]
            verbs: ["get", "create", "patch", "update"]

  - it: omits credential Secret access in managed mode
    set:
      server.drivers.kubernetes.workspaceMode: managed
      server.credentialDrivers.kubernetesSecrets.enabled: true
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "create", "patch", "delete"]

  - it: omits all Secret rules in operator mode
    set:
      server.drivers.kubernetes.workspaceMode: operator
      server.tls.clientTlsSecretName: custom-client-tls
      server.credentialDrivers.kubernetesSecrets.enabled: true
    asserts:
      - notExists:
          path: rules[*].resources[?(@ == "secrets")]

  - it: names no Secrets in managed mode
    set:
      server.drivers.kubernetes.workspaceMode: managed
      server.tls.clientTlsSecretName: custom-client-tls
      server.sandboxImagePullSecrets:
        - name: registry-one
        - name: registry-two
    asserts:
      # The only rule that may name anything is exactly the bind on the
      # NetworkPolicy guard ClusterRole: one resource, clusterroles, and one
      # verb, bind.
      - notExists:
          path: rules[?(@.resources[0] != "clusterroles")].resourceNames
      - notExists:
          path: rules[?(@.resources[1])].resourceNames
      - notExists:
          path: rules[?(@.verbs[0] != "bind")].resourceNames
      - notExists:
          path: rules[?(@.verbs[1])].resourceNames
      - notExists:
          path: rules[?(@.resourceNames[0] != "openshell-netpol-guard-my-namespace")].resourceNames
      - notExists:
          path: rules[?(@.resourceNames[1])].resourceNames
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["create", "delete"]

  - it: omits secrets rule entirely in shared mode
    set:
      server.drivers.kubernetes.workspaceMode: shared
    asserts:
      - notExists:
          path: rules[*].resources[?(@ == "secrets")]

  - it: grants managed sandbox-runtime companion permissions
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          workspace_mode: managed
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods"]
            verbs: ["create", "delete", "get", "list", "patch", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["services"]
            verbs: ["create", "get"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["create", "delete"]

  - it: grants operator sandbox-runtime companion permissions
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          workspace_mode: operator
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods"]
            verbs: ["create", "delete", "get", "list", "patch", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["services"]
            verbs: ["create", "get"]
  - it: omits the ClusterRole when cluster-scoped RBAC is disabled
    set:
      rbac.clusterScoped.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: omits the ClusterRole when all chart-managed RBAC is disabled
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: omits the ClusterRole independently of the workspace mode
    set:
      rbac.clusterScoped.create: false
      server.drivers.kubernetes.workspaceMode: managed
    asserts:
      - hasDocuments:
          count: 0

  - it: uses the configured ClusterRole name
    set:
      rbac.clusterScoped.clusterRoleName: platform-openshell-node-reader
    asserts:
      - equal:
          path: metadata.name
          value: platform-openshell-node-reader

  - it: creates the ClusterRole when legacy values omit the rbac block
    set:
      rbac: null
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: openshell-node-reader-my-namespace

  - it: lets managed mode bind only the NetworkPolicy guard ClusterRole
    set:
      server.drivers.kubernetes.workspaceMode: managed
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["rbac.authorization.k8s.io"]
            resources: ["rolebindings"]
            verbs: ["create", "get"]
      - contains:
          path: rules
          content:
            apiGroups: ["rbac.authorization.k8s.io"]
            resources: ["clusterroles"]
            verbs: ["bind"]
            resourceNames: ["openshell-netpol-guard-my-namespace"]
      # bind without resourceNames would allow binding any ClusterRole.
      - notContains:
          path: rules
          content:
            apiGroups: ["rbac.authorization.k8s.io"]
            resources: ["clusterroles"]
            verbs: ["bind"]

  - it: never grants cluster-wide NetworkPolicy list or watch
    set:
      server.drivers.kubernetes.workspaceMode: managed
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["networkpolicies"]
            verbs: ["create", "get", "list", "watch", "update"]
      - notContains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["networkpolicies"]
            verbs: ["list", "watch", "update"]

  - it: does not grant RoleBinding creation outside managed mode
    set:
      server.drivers.kubernetes.workspaceMode: operator
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["rbac.authorization.k8s.io"]
            resources: ["rolebindings"]
            verbs: ["create", "get"]
