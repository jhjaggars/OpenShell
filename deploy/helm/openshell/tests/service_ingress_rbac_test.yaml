suite: Service ingress RBAC
templates:
  - templates/service-ingress-rbac.yaml
release:
  name: openshell
  namespace: my-namespace

tests:
  - it: renders no documents unless reconciliation is enabled
    asserts:
      - hasDocuments:
          count: 0

  - it: grants service ingress object access when reconciliation is enabled
    set:
      serviceIngress.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: openshell-service-ingress
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: my-namespace
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups:
              - route.openshift.io
            resources:
              - routes
            verbs:
              - get
              - list
              - create
              - delete
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups:
              - route.openshift.io
            resources:
              - routes/custom-host
            verbs:
              - create
              - patch
              - update
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups:
              - gateway.networking.k8s.io
            resources:
              - httproutes
            verbs:
              - get
              - list
              - create
              - delete
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups:
              - networking.k8s.io
            resources:
              - ingresses
            verbs:
              - get
              - list
              - create
              - delete
        documentIndex: 0

  - it: binds the role to the gateway service account in the release namespace
    set:
      serviceIngress.enabled: true
    asserts:
      - equal:
          path: kind
          value: RoleBinding
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: my-namespace
        documentIndex: 1
      - equal:
          path: roleRef.kind
          value: Role
        documentIndex: 1
      - equal:
          path: roleRef.name
          value: openshell-service-ingress
        documentIndex: 1
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
        documentIndex: 1
      - equal:
          path: subjects[0].namespace
          value: my-namespace
        documentIndex: 1

  - it: honors raw TOML gateway config enablement
    set:
      gatewayConfig:
        openshell.drivers.kubernetes.service_ingress:
          enabled: true
    asserts:
      - hasDocuments:
          count: 2

  - it: renders no documents when chart RBAC ownership is disabled
    set:
      serviceIngress.enabled: true
      rbac:
        create: false
    asserts:
      - hasDocuments:
          count: 0
