suite: Service ingress RBAC
templates:
  - templates/service-ingress-serviceaccount.yaml
  - templates/service-ingress-role.yaml
  - templates/service-ingress-rolebinding.yaml
  - templates/service-ingress-publisher-role.yaml
  - templates/service-ingress-publisher-rolebinding.yaml
release:
  name: openshell
  namespace: my-namespace

tests:
  - it: renders no documents unless reconciliation is enabled
    asserts:
      - hasDocuments:
          count: 0

  - it: creates a dedicated controller service account when enabled
    template: templates/service-ingress-serviceaccount.yaml
    set:
      serviceIngress.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: ServiceAccount
      - equal:
          path: metadata.name
          value: openshell-service-ingress
      - equal:
          path: metadata.namespace
          value: my-namespace

  - it: grants the controller feed reads and ingress object access
    template: templates/service-ingress-role.yaml
    set:
      serviceIngress.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Role
      - equal:
          path: metadata.namespace
          value: my-namespace
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - configmaps
            verbs:
              - get
              - list
              - watch
      - contains:
          path: rules
          content:
            apiGroups:
              - route.openshift.io
            resources:
              - routes
            verbs:
              - get
              - list
              - create
              - delete
      - contains:
          path: rules
          content:
            apiGroups:
              - route.openshift.io
            resources:
              - routes/custom-host
            verbs:
              - create
              - patch
              - update
      - contains:
          path: rules
          content:
            apiGroups:
              - gateway.networking.k8s.io
            resources:
              - httproutes
            verbs:
              - get
              - list
              - create
              - delete
      - contains:
          path: rules
          content:
            apiGroups:
              - networking.k8s.io
            resources:
              - ingresses
            verbs:
              - get
              - list
              - create
              - delete

  - it: binds the controller role to the controller service account only
    template: templates/service-ingress-rolebinding.yaml
    set:
      serviceIngress.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: RoleBinding
      - equal:
          path: roleRef.name
          value: openshell-service-ingress
      - equal:
          path: subjects[0].name
          value: openshell-service-ingress
      - equal:
          path: subjects[0].namespace
          value: my-namespace

  - it: scopes feed publishing to the feed object for the gateway identity
    template: templates/service-ingress-publisher-role.yaml
    set:
      serviceIngress.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Role
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - configmaps
            resourceNames:
              - openshell-service-ingress-hostnames
            verbs:
              - get
              - update
              - patch
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - configmaps
            verbs:
              - create

  - it: binds the publisher role to the gateway service account
    template: templates/service-ingress-publisher-rolebinding.yaml
    set:
      serviceIngress.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: RoleBinding
      - equal:
          path: roleRef.name
          value: openshell-service-ingress-publisher
      - equal:
          path: subjects[0].name
          value: openshell

  - it: grants service ingress access in managed workspace mode
    template: templates/service-ingress-role.yaml
    set:
      server.drivers.kubernetes.workspaceMode: managed
      serviceIngress.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.namespace
          value: my-namespace

  - it: honors raw TOML gateway config enablement
    template: templates/service-ingress-serviceaccount.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes.service_ingress:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: renders no documents when chart RBAC ownership is disabled
    set:
      serviceIngress.enabled: true
      rbac:
        create: false
    asserts:
      - hasDocuments:
          count: 0
