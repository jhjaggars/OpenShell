{{- /* Ingress-object and hostname-feed read permissions for the dedicated
       service-ingress controller. All reconciled objects (OpenShift Routes,
       Gateway API HTTPRoutes, and networking.k8s.io Ingresses) and the feed
       ConfigMap live in the gateway's own namespace, so a namespaced Role is
       sufficient — no cluster-scoped permissions are required for this
       feature. The rules cover every supported kind because the reconciled
       kind is selected by configuration. */ -}}
{{- $gatewayConfig := .Values.gatewayConfig | default dict -}}
{{- $serviceIngressTOML := get $gatewayConfig "openshell.drivers.kubernetes.service_ingress" | default dict -}}
{{- $serviceIngressEnabled := false -}}
{{- if hasKey $serviceIngressTOML "enabled" -}}
{{- $serviceIngressEnabled = get $serviceIngressTOML "enabled" -}}
{{- else if hasKey .Values "serviceIngress" -}}
{{- $serviceIngressEnabled = .Values.serviceIngress.enabled -}}
{{- end -}}
{{- if and (include "openshell.rbacCreate" .) $serviceIngressEnabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openshell.fullname" . }}-service-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
rules:
  # Read the hostname feed the gateway publishes.
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - get
      - list
      - create
      - delete
  # Setting a custom spec.host on an OpenShift Route requires the
  # custom-host subresource in addition to routes themselves.
  - apiGroups:
      - route.openshift.io
    resources:
      - routes/custom-host
    verbs:
      - create
      - patch
      - update
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
      - create
      - delete
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - create
      - delete
{{- end }}
