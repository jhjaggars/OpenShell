{{- /* Feed-publishing permissions for the gateway ServiceAccount. Update,
       patch, and get are pinned to the feed object itself; create cannot be
       name-scoped because the object does not exist yet. */ -}}
{{- $gatewayConfig := .Values.gatewayConfig | default dict -}}
{{- $serviceIngressTOML := get $gatewayConfig "openshell.drivers.kubernetes.service_ingress" | default dict -}}
{{- $serviceIngressEnabled := false -}}
{{- if hasKey $serviceIngressTOML "enabled" -}}
{{- $serviceIngressEnabled = get $serviceIngressTOML "enabled" -}}
{{- else if hasKey .Values "serviceIngress" -}}
{{- $serviceIngressEnabled = .Values.serviceIngress.enabled -}}
{{- end -}}
{{- if and (include "openshell.rbacCreate" .) $serviceIngressEnabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openshell.fullname" . }}-service-ingress-publisher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - {{ include "openshell.fullname" . }}-service-ingress-hostnames
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
{{- end }}
